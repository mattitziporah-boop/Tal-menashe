<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>📞 דף קשר טל מנשה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fce7f3 0%, #e0f2fe 100%);
      --cream-card: #fef9ec;
      --cream-border: #fde68a;
      --husband-color: #1d4ed8;
      --wife-color: #be185d;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --wa-green: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Heebo', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      padding: 20px 16px 56px;
      line-height: 1.5;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    header h1 {
      font-size: 1.85rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 4px;
    }

    header .subtitle {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .controls-bar {
      position: sticky;
      top: 12px;
      z-index: 10;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      font-family: 'Heebo', sans-serif;
      font-size: 1rem;
      color: var(--text-main);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: #60a5fa;
      box-shadow: 0 4px 18px rgba(59, 130, 246, 0.15);
    }

    .sort-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sort-btn {
      flex: 1;
      min-width: 140px;
      padding: 9px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(255, 255, 255, 0.85);
      font-family: 'Heebo', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
      transition: all 0.15s;
    }

    .sort-btn.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 16px 18px;
      margin-bottom: 14px;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .card.roles-card {
      background: var(--cream-card);
      border: 1px solid var(--cream-border);
      margin-bottom: 22px;
    }

    .roles-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #92400e;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .role-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(217, 119, 6, 0.12);
    }

    .role-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

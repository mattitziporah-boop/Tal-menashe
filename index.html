    function normPhone(raw) {
      if (!raw) return '';
      let s = String(raw).trim();
      if (!s) return '';
      let digits = s.replace(/\D/g, '');
      if (digits.startsWith('972')) {
        digits = '0' + digits.slice(3);
      }
      if (digits.length === 10) {
        return `${digits.slice(0, 3)}-${digits.slice(3)}`;
      }
      return s;
    }

    function parseCSV(text) {
      const cleanText = text.replace(/^\uFEFF/, '');
      const rows = [];
      let row = [];
      let val = '';
      let inQuotes = false;

      for (let i = 0; i < cleanText.length; i++) {
        const ch = cleanText[i];
        const next = cleanText[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') {
            val += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            val += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            row.push(val.trim());
            val = '';
          } else if (ch === '\r' && next === '\n') {
            row.push(val.trim());
            rows.push(row);
            row = [];
            val = '';
            i++;
          } else if (ch === '\n' || ch === '\r') {
            row.push(val.trim());
            rows.push(row);
            row = [];
            val = '';
          } else {
            val += ch;
          }
        }
      }

      if (val.length > 0 || row.length > 0) {
        row.push(val.trim());
        rows.push(row);
      }
      return rows;
    }

        extraContacts = parsedExtra;
        document.getElementById('extraToggleLabel').textContent =
          `רשומות נוספות מהקובץ (${extraContacts.length} שורות ללא שם משפחה / מגרש)`;
      }
    }

    async function loadFromGoogleSheets() {
      const statusEl = document.getElementById('syncStatus');
      try {
        const sep = SHEET_CSV_URL.includes('?') ? '&' : '?';
        const res = await fetch(`${SHEET_CSV_URL}${sep}_t=${Date.now()}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const csvText = await res.text();
        const rows = parseCSV(csvText);
        applySheetData(rows);
        renderAll(currentFilter);
        statusEl.textContent = 'מעודכן אוטומטית מ-Google Sheets';
      } catch (err) {
        console.warn('Sheet fetch fallback:', err);
        statusEl.textContent = 'מוצגים נתוני גיבוי מקומיים';
      }
    }

    function formatWaLink(phone) {
      const digits = phone.replace(/\D/g, '');
      const intl = digits.startsWith('0') ? '972' + digits.slice(1) : digits;
      return `https://wa.me/${intl}`;
    }

    function renderActions(phone) {
      if (!phone) return '';
      const cleanTel = phone.replace(/[^0-9+]/g, '');
      return `
        <span class="actions">
          <a class="phone-link" href="tel:${cleanTel}">${phone}</a>
          <a class="wa-btn" href="${formatWaLink(phone)}" target="_blank" rel="noopener noreferrer" title="שליחת הודעת וואטסאפ">💬</a>
        </span>
      `;
    }

    function renderRoles(filter = '') {
      const container = document.getElementById('rolesList');
      const card = document.getElementById('rolesCard');
      const filtered = roles.filter(r =>
        `${r.name} ${r.role} ${r.phone}`.toLowerCase().includes(filter)
      );

      if (filtered.length === 0) {
        card.style.display = 'none';
        return;
      }
      card.style.display = 'block';
      container.innerHTML = filtered.map(r => `
        <div class="role-row">
          <div class="role-info">
            ${r.name ? `<span class="role-name">${r.name}</span> — ` : ''}
            <span class="role-desc">${r.role}</span>
          </div>
          ${renderActions(r.phone)}
        </div>
      `).join('');
    }

    function parsePlotKey(plotStr) {
      if (!plotStr || !plotStr.trim()) {
        return [999999, 999999, ''];
      }
      const normalized = plotStr.trim().replace('.', '/');
      const parts = normalized.split('/');
      const mainNum = parseFloat(parts[0]);
      const subNum = parts.length > 1 ? parseFloat(parts[1]) : 0;
      return [
        isNaN(mainNum) ? 999998 : mainNum,
        isNaN(subNum) ? 0 : subNum,
        plotStr.trim()
      ];
    }

    function getSortedFamilies() {
      const copy = [...families];
      if (currentSort === 'lastname') {
        copy.sort((a, b) => {
          const cmp = a.last.localeCompare(b.last, 'he');
          if (cmp !== 0) return cmp;
          const ka = parsePlotKey(a.plot);
          const kb = parsePlotKey(b.plot);
          if (ka[0] !== kb[0]) return ka[0] - kb[0];
          return ka[1] - kb[1];
        });
      } else if (currentSort === 'plot') {
        copy.sort((a, b) => {
          const ka = parsePlotKey(a.plot);
          const kb = parsePlotKey(b.plot);
          if (ka[0] !== kb[0]) return ka[0] - kb[0];
          if (ka[1] !== kb[1]) return ka[1] - kb[1];
          return a.last.localeCompare(b.last, 'he');
        });
      }
      return copy;
    }

    function renderFamilies(filter = '') {
      const container = document.getElementById('familiesList');
      const emptyState = document.getElementById('emptyState');
      const ordered = getSortedFamilies();

      const filtered = ordered.filter(f => {
        const searchable = [
          f.last,
          f.plot,
          f.husband?.name,
          f.husband?.phone,
          f.wife?.name,
          f.wife?.phone
        ].filter(Boolean).join(' ').toLowerCase();
        return searchable.includes(filter);
      });

      if (filtered.length === 0) {
        container.innerHTML = '';
        emptyState.style.display = filter ? 'block' : 'none';
        return;
      }

      emptyState.style.display = 'none';
      container.innerHTML = filtered.map(f => {
        const title = f.plot ? `משפחת ${f.last} (${f.plot})` : `משפחת ${f.last}`;
        let contactsHtml = '';

        if (f.husband && (f.husband.name || f.husband.phone)) {
          contactsHtml += `
            <div class="contact-row">
              <span class="husband-label">בעל${f.husband.name ? ' - ' + f.husband.name : ''}</span>
              ${renderActions(f.husband.phone)}
            </div>
          `;
        }

        if (f.wife && (f.wife.name || f.wife.phone)) {
          contactsHtml += `
            <div class="contact-row">
              <span class="wife-label">אישה${f.wife.name ? ' - ' + f.wife.name : ''}</span>
              ${renderActions(f.wife.phone)}
            </div>
          `;
        }

        return `
          <article class="card">
            <div class="family-header">${title}</div>
            ${contactsHtml}
          </article>
        `;
      }).join('');
    }

    function renderExtra(filter = '') {
      const container = document.getElementById('extraList');
      const section = document.getElementById('extraSection');
      const filtered = extraContacts.filter(item =>
        `${item.husband_name} ${item.husband_phone} ${item.wife_name} ${item.wife_phone}`.toLowerCase().includes(filter)
      );

      if (filtered.length === 0) {
        section.style.display = 'none';
        return;
      }
      section.style.display = 'block';
      if (filter) {
        container.classList.add('open');
        document.getElementById('extraArrow').textContent = '▲';
      }

      container.innerHTML = filtered.map(item => {
        const label = item.husband_name
          ? `<span class="husband-label">בעל - ${item.husband_name}</span>`
          : item.wife_name
            ? `<span class="wife-label">אישה - ${item.wife_name}</span>`
            : `<span style="color:#64748b;font-weight:600;">איש קשר (שורה ${item.index})</span>`;
        const phone = item.husband_phone || item.wife_phone || '';
        return `
          <div class="card">
            <div class="contact-row">
              ${label}
              ${renderActions(phone)}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderAll(filter = '') {
      renderRoles(filter);
      renderFamilies(filter);
      renderExtra(filter);
    }

    document.querySelectorAll('.sort-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentSort = btn.dataset.sort;
        document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderFamilies(currentFilter);
      });
    });

    document.getElementById('extraToggle').addEventListener('click', () => {
      const list = document.getElementById('extraList');
      const arrow = document.getElementById('extraArrow');
      const isOpen = list.classList.toggle('open');
      arrow.textContent = isOpen ? '▲' : '▼';
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      currentFilter = e.target.value.trim().toLowerCase();
      renderAll(currentFilter);
    });

    renderAll();
    loadFromGoogleSheets();
  </script>
</body>
</html>
